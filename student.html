
<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <style>
        body { font-family: Arial; background: #eee; text-align: center; }
        h1 { background: blue; color: white; padding: 15px; }
        table { margin: 20px auto; width: 80%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid gray; }
        th { background: black; color: white; }
        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
        footer { background: black; color: white; padding: 15px; }
    </style>
</head>
<body>

<h1>Student Management System</h1>
<h2>Student List</h2>

<table>
    <tr>
        <th>Roll No</th>
        <th>Name</th>
        <th>Marks</th>
        <th>Result</th>
    </tr>
    <tbody id="list"></tbody>
</table>

<h3 id="summary"></h3>

<footer>
    Student Management System | © 2026
</footer>

<script>
    let students = [
        {id:101, name:"Rahul", marks:85},
        {id:102, name:"Sanjay", marks:72},
        {id:103, name:"Priya", marks:30},
        {id:104, name:"Kiran", marks:90},
        {id:105, name:"Anjali", marks:25}
    ];

    let pass = 0, fail = 0;

    students.forEach(s => {
        let result = s.marks >= 35 ? "PASS" : "FAIL";
        result == "PASS" ? pass++ : fail++;

        document.getElementById("list").innerHTML += `
            <tr>
                <td>${s.id}</td>
                <td>${s.name}</td>
                <td>${s.marks}</td>
                <td class="${result.toLowerCase()}">${result}</td>
            </tr>`;
    });

    document.getElementById("summary").innerHTML =
        `Total: 5 | Passed: ${pass} | Failed: ${fail}`;
</script>

</body>
</html>
